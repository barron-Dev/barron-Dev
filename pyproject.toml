[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
dependencies = [
    "Pillow==11.3.0",
    "aiokafka==0.12.0",
    "cryptography==50.0.1",
    "psycopg[binary]==3.2.10",
    "python-multipart==0.0.20",
]
name = "cyclothone-platform"
version = "0.1.0"
description = "Cyclothone zero-trust security platform"
requires-python = ">=3.11"

[project.optional-dependencies]
attribution-graph = ["igraph>=0.11,<1.0", "leidenalg>=0.10,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
