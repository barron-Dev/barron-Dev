[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
dependencies = ["Pillow==11.3.0"]
name = "cyclothone-platform"
version = "0.1.0"
description = "Cyclothone zero-trust security platform"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
