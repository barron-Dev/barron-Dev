name: GIRIL Gates

on:
  push:
    paths:
      - "src/cyclothone/giril/**"
      - "tests/test_giril_*.py"
      - ".github/workflows/giril-gates.yml"
  pull_request:
    paths:
      - "src/cyclothone/giril/**"
      - "tests/test_giril_*.py"
      - ".github/workflows/giril-gates.yml"

jobs:
  giril-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e . pytest
      - name: Run GIRIL tests
        run: pytest -q tests/test_giril_*.py
