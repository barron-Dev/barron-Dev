name: Cyclothone iOS

on:
  push:
    branches: [ios/cyclothone-mobile-v1]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS simulator target
        working-directory: ios/Cyclothone
        run: |
          set -o pipefail
          xcodebuild             -project Cyclothone.xcodeproj             -scheme Cyclothone             -sdk iphonesimulator             -configuration Debug             -destination 'generic/platform=iOS Simulator'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             build

      - name: Verify app bundle
        working-directory: ios/Cyclothone
        run: |
          ls -la build/Build/Products/Debug-iphonesimulator/
          test -d build/Build/Products/Debug-iphonesimulator/Cyclothone.app
