name: Cyclothone iOS

on:
  push:
    branches: [ios/cyclothone-mobile-v1]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS simulator target
        working-directory: ios/Cyclothone
        run: |
          set -o pipefail
          xcodebuild             -project Cyclothone.xcodeproj             -scheme Cyclothone             -sdk iphonesimulator             -configuration Debug             -destination 'generic/platform=iOS Simulator'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             build

      - name: Verify app bundle
        working-directory: ios/Cyclothone
        run: |
          set -euo pipefail
          APP_PATH="$(find build -type d -name 'Cyclothone.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          echo "Verified iOS app bundle: $APP_PATH"
