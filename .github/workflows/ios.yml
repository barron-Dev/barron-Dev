name: Cyclothone iOS

on:
  push:
    branches: [ios/cyclothone-mobile-v1]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose iOS scheme
        working-directory: ios/Cyclothone
        run: |
          xcodebuild -list -project Cyclothone.xcodeproj
          xcodebuild -showdestinations -project Cyclothone.xcodeproj -scheme Cyclothone || true
          grep -nE "SDKROOT|SUPPORTED_PLATFORMS|IPHONEOS_DEPLOYMENT_TARGET|MACOSX_DEPLOYMENT_TARGET" Cyclothone.xcodeproj/project.pbxproj

      - name: List simulators
        run: xcrun simctl list devices available

      - name: Build (iOS Simulator)
        working-directory: ios/Cyclothone
        run: |
          set -o pipefail
          xcodebuild             -project Cyclothone.xcodeproj             -scheme Cyclothone             -sdk iphonesimulator             -configuration Debug             -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             build

      - name: Verify app bundle
        working-directory: ios/Cyclothone
        run: |
          set -euo pipefail
          APP_PATH="$(find build -type d -name 'Cyclothone.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          echo "Verified iOS app bundle: $APP_PATH"
