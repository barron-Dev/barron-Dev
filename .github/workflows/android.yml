name: Cyclothone Android

on:
  push:
    branches: [android/cyclothone-mobile-v1]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build customer APK
        working-directory: android
        run: gradle :app:assembleCustomerDebug --no-daemon
      - name: Build developer APK
        working-directory: android
        run: gradle :app:assembleDeveloperDebug --no-daemon
      - name: Verify customer APK
        working-directory: android
        run: test -s app/build/outputs/apk/customer/debug/app-customer-debug.apk
      - name: Verify developer APK
        working-directory: android
        run: test -s app/build/outputs/apk/developer/debug/app-developer-debug.apk
      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: cyclothone-android-customer-debug
          path: android/app/build/outputs/apk/customer/debug/app-customer-debug.apk
          if-no-files-found: error
      - name: Upload developer APK
        uses: actions/upload-artifact@v4
        with:
          name: cyclothone-android-developer-debug
          path: android/app/build/outputs/apk/developer/debug/app-developer-debug.apk
          if-no-files-found: error

# Android authentication changes must be validated by CI.
