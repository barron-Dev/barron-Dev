name: MDI Copilot + Compliance Gates
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*mdi*"
      - "services/copilot/**"
      - "services/compliance/**"
      - "src/cyclothone/api/routes/mobile_intelligence_*.py"
      - "console/app/customer/services/**"
      - "console/lib/mdi/auth.ts"
      - ".github/workflows/mdi-copilot-compliance-gates.yml"
  pull_request:
    paths:
      - "supabase/migrations/*mdi*"
      - "services/copilot/**"
      - "services/compliance/**"
      - "src/cyclothone/api/routes/mobile_intelligence_*.py"
      - "console/app/customer/services/**"
      - "console/lib/mdi/auth.ts"
jobs:
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Service-role client is isolated to a server-only module
        run: |
          if grep -RIn "SUPABASE_SERVICE_ROLE_KEY" console/app console/components --include='*.ts' --include='*.tsx'; then
            echo "service-role reference found in client-facing app/component code"; exit 1
          fi
          grep -q "^import 'server-only';" console/lib/mdi/auth.ts || { echo "privileged MDI helper must import server-only"; exit 1; }
      - name: Copilot route must use authenticated MDI backend
        run: |
          grep -q 'mobile-intelligence/copilot' src/cyclothone/api/routes/mobile_intelligence_copilot.py
          grep -q 'authenticate_request' src/cyclothone/api/routes/mobile_intelligence_copilot.py
      - name: Compliance rule coverage
        run: |
          for j in GDPR UAE_PDPL SAUDI_PDPL POPIA DPDP_IN; do
            grep -q "'$j'" supabase/migrations/*mdi_copilot_compliance.sql || { echo "missing $j"; exit 1; }
          done
      - name: No production database dependency
        run: |
          ! grep -RIn "DATABASE_URL" .github/workflows/mdi-copilot-compliance-gates.yml
