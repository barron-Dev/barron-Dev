name: Sentinel Python

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'sql/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'requirements-ml.txt'
      - 'requirements-server.txt'
      - 'pyproject.toml'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'sql/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'requirements-ml.txt'
      - 'requirements-server.txt'
      - 'pyproject.toml'
      - '.github/workflows/python-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ml.txt -r requirements-server.txt reportlab
          python -m pip install -e .
      - name: Validate migration sources
        run: python scripts/validate_migrations.py
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run Python tests
        run: python -m pytest -q
      - name: Build production image
        run: docker build --pull -t sentinel-platform:ci .
