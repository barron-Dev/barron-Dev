name: Sentinel Python

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements-ml.txt'
      - 'pyproject.toml'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements-ml.txt'
      - 'pyproject.toml'
      - '.github/workflows/python-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ML and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ml.txt reportlab
      - name: Run Python tests
        run: python -m pytest -q
