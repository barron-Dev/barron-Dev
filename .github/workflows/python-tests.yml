name: Sentinel CI

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'sql/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'requirements-ml.txt'
      - 'requirements-server.txt'
      - 'pyproject.toml'
      - 'console/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'sql/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'requirements-ml.txt'
      - 'requirements-server.txt'
      - 'pyproject.toml'
      - 'console/**'
      - '.github/workflows/python-tests.yml'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ml.txt -r requirements-server.txt reportlab
          python -m pip install -e .
      - name: Validate migration sources
        run: python scripts/validate_migrations.py
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run Python tests
        if: always()
        run: |
          python -m pytest -q --tb=short -ra --maxfail=5 2>&1 | tee pytest.log
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          retention-days: 14
      - name: Build production image
        run: docker build --pull -t sentinel-platform:ci .

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install console dependencies
        run: npm install --no-audit --no-fund
      - name: Build Sentinel Console
        run: npm run build
